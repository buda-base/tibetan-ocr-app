[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bdrc-tibetan-ocr"
version = "0.3.0"
description = "Desktop OCR application for Tibetan text using BDRC pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Eric Werner"},
    {name = "Buddhist Digital Resource Center", email = "info@bdrc.io"}
]
maintainers = [
    {name = "Buddhist Digital Resource Center", email = "info@bdrc.io"}
]
keywords = [
    "ocr",
    "tibetan",
    "buddhist",
    "machine-learning",
    "onnx",
    "pyside6",
    "desktop-application"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Text Processing :: Linguistic",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt"
]

dependencies = [
    "onnxruntime>=1.15.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "PySide6>=6.5.0",
    "PySide6-Addons>=6.5.0",
    "PySide6-Essentials>=6.5.0",
    "pyctcdecode>=0.5.0",
    "pyewts>=1.0.0",
    "thin-plate-spline>=0.0.3",
    "pdf2image>=1.16.0",
    "pypdf>=3.0.0",
    "pillow>=10.0.0",
    "coloredlogs>=15.0.0",
    "colorama>=0.4.6",
    "humanfriendly>=10.0.0",
    "tqdm>=4.65.0",
    "platformdirs>=3.0.0",
    "PyYAML>=6.0.0",
    "requests>=2.31.0",
    "urllib3>=2.0.0",
    "certifi>=2023.0.0",
    "attrs>=23.0.0",
    "pygtrie>=2.5.0",
    "ordered-set>=4.1.0",
    "sortedcontainers>=2.4.0",
    "protobuf>=4.23.0",
    "flatbuffers>=23.5.0",
    "fsspec>=2023.6.0",
    "filelock>=3.12.0",
    "typing-extensions>=4.7.0",
    "zstandard>=0.21.0",
    "sympy>=1.12.0",
    "mpmath>=1.3.0",
    "hypothesis>=6.82.0",
    "idna>=3.4.0",
    "charset-normalizer>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "Nuitka>=2.0.0",
]

windows = [
    "pyreadline3>=3.4.0",
]

[project.scripts]
bdrc-ocr = "cli:main"

[project.urls]
Homepage = "https://github.com/buda-base/tibetan-ocr-app"
Repository = "https://github.com/buda-base/tibetan-ocr-app"
Issues = "https://github.com/buda-base/tibetan-ocr-app/issues"

[tool.ruff]
line-length = 100
target-version = "py310"
